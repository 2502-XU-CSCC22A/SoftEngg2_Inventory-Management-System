services:
  db:
    image: postgres:18
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - 5433:5432
    volumes:
      - db-data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_client:
    image: dpage/pgadmin4
    container_name: db_client
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
    ports:
      - 5050:80
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${EXPRESS_PORT}:3000
    depends_on:
      db:
       condition: service_healthy
    volumes:
      - ./images:/app/uploads


  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
